<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Legion of Honor star">
  <rect width="64" height="64" rx="12" fill="#1b1815" />
  <g transform="translate(32 33)">
    <g fill="#c8a24a">
      <!-- Five-armed star of the Legion of Honor, drawn as ten radial spikes. -->
      <g id="arm">
        <path d="M0 -22 L4.2 -6 L0 -3 L-4.2 -6 Z" />
      </g>
      <use href="#arm" transform="rotate(72)" />
      <use href="#arm" transform="rotate(144)" />
      <use href="#arm" transform="rotate(216)" />
      <use href="#arm" transform="rotate(288)" />
    </g>
    <circle r="6.5" fill="#8c2f39" />
    <circle r="6.5" fill="none" stroke="#c8a24a" stroke-width="1.5" />
  </g>
</svg>
